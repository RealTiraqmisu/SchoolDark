<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งค่าบุคลากร — ศูนย์รวมการตั้งค่า</title>

  <!-- Google Fonts: Sarabun (เนื้อหา) + Outfit (หัวข้อ แบบเดียวกับ care) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind config: โทนเดิมของศูนย์ตั้งค่า + พาเลต sd-* ของ care (ม่วง) สำหรับเนื้อหาที่ย้ายมาจาก schooldark -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#3e63dd', foreground: '#ffffff', hover: '#2f51c7' },
            secondary: { DEFAULT: '#f1f3f9', foreground: '#1e293b' },
            success: { DEFAULT: '#10b981', foreground: '#ffffff' },
            warning: { DEFAULT: '#f59e0b', foreground: '#78350f' },
            info: { DEFAULT: '#0284c7', foreground: '#ffffff' },
            destructive: { DEFAULT: '#ef4444', foreground: '#ffffff' },
            muted: { DEFAULT: '#f8fafc', foreground: '#64748b' },
            card: { DEFAULT: '#ffffff', foreground: '#0f172a' },
            border: '#e2e8f0',
            sd: {
              primary: 'hsl(250 75% 55%)', 'primary-hover': 'hsl(250 85% 48%)', 'primary-glow': 'hsla(250,75%,55%,0.1)',
              success: 'hsl(142 76% 36%)', 'success-bg': 'rgba(16,185,129,0.1)',
              warning: 'hsl(38 92% 40%)', 'warning-bg': 'rgba(245,158,11,0.08)',
              danger: 'hsl(350 74% 48%)', 'danger-bg': 'rgba(239,68,68,0.08)',
              info: 'hsl(199 89% 40%)', 'info-bg': 'rgba(14,165,233,0.08)',
              text: 'hsl(222 47% 12%)', 'text-2': 'hsl(215 25% 35%)', muted: 'hsl(215 15% 55%)', border: 'rgba(0,0,0,0.12)'
            }
          },
          fontFamily: { sans: ['Sarabun', 'sans-serif'], heading: ['Outfit', 'Sarabun', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body { background-color: #f8fafc; }
    /* กันหน้าเลื่อนแนวนอนบนมือถือ (ตารางเลื่อนภายในการ์ดเอง) */
    html, body { overflow-x: hidden; }
  </style>
  <link rel="stylesheet" href="../shared/cross-nav.css">
</head>
<body class="font-sans antialiased text-card-foreground">
<script src="../shared/cross-nav.js"></script>

  <!-- Header เรียบ ๆ ของศูนย์ตั้งค่า -->
  <header class="border-b border-slate-200 bg-card sticky top-0 z-30 shadow-sm">
    <div class="mx-auto flex max-w-[1400px] items-center gap-3 px-4 sm:px-6 py-4">
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary text-primary-foreground shadow-sm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <div>
        <h1 class="text-lg font-bold leading-tight text-slate-900">ศูนย์รวมการตั้งค่า</h1>
        <p class="text-xs text-slate-500">School Settings Center</p>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[1400px] px-4 sm:px-6 py-6 pb-24">
    <!-- Breadcrumb -->
    <div class="flex items-center gap-2 text-xs text-slate-500 mb-4 mt-2 flex-wrap">
      <a href="index.html" class="hover:underline">ศูนย์รวมการตั้งค่า</a>
      <span class="text-slate-400">&rsaquo;</span>
      <span>ตั้งค่าบุคลากร</span>
      <span class="text-slate-400">&rsaquo;</span>
      <span id="crumb-tab" class="text-slate-700 font-medium"></span>
    </div>

    <!-- Title Area -->
    <div class="flex items-center justify-between mb-8 flex-wrap gap-4">
      <div class="flex items-center gap-3">
        <div id="tab-icon-tile" class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-sd-primary text-white shadow-md"></div>
        <div>
          <h2 id="tab-title" class="font-heading text-2xl font-bold tracking-tight text-slate-900"></h2>
          <p id="tab-desc" class="text-xs text-slate-500"></p>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex items-center gap-1 bg-white border border-slate-200 p-1 rounded-xl max-w-5xl mb-6 flex-wrap">
      <a href="#tab=schedule" data-tab-link="schedule" class="tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs font-semibold transition-colors">วันเวลาเข้าออก</a>
      <a href="#tab=permissions" data-tab-link="permissions" class="tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs font-semibold transition-colors">สิทธิ์ผู้ใช้งาน</a>
      <a href="#tab=signatories" data-tab-link="signatories" class="tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs font-semibold transition-colors">ผู้ลงนามเอกสาร</a>
      <a href="#tab=staff-types" data-tab-link="staff-types" class="tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs font-semibold transition-colors">ประเภทบุคลากร</a>
      <a href="#tab=positions" data-tab-link="positions" class="tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs font-semibold transition-colors">ตำแหน่ง</a>
      <a href="#tab=departments" data-tab-link="departments" class="tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs font-semibold transition-colors">แผนก/กลุ่มสาระฯ</a>
    </div>

    <!-- เนื้อหาของแท็บ (สร้างโดย js/personnel-settings.js) -->
    <div id="panel" class="max-w-6xl text-sd-text"></div>
  </main>

  <!-- Modals ของทุกแท็บ (สร้างโดย js/personnel-settings.js) -->
  <div id="modal-root"></div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 max-w-[calc(100vw-2.5rem)] flex items-center gap-3 bg-white border border-slate-200 px-5 py-4 rounded-xl shadow-2xl transition-all duration-300 translate-y-10 opacity-0 pointer-events-none z-[70]">
    <div id="toast-icon"></div>
    <p id="toast-message" class="text-sm font-semibold text-slate-700"></p>
  </div>

  <script src="js/sd-settings-store.js"></script>
  <script src="js/personnel-settings.js"></script>
</body>
</html>
