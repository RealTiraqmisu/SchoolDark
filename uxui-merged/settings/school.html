<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งค่าโรงเรียน — ศูนย์รวมการตั้งค่า</title>

  <!-- Google Fonts Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Tailwind Config to match theme (เหมือน admission/course_settings.html) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#3e63dd', foreground: '#ffffff', hover: '#2f51c7' },
            secondary: { DEFAULT: '#f1f3f9', foreground: '#1e293b' },
            success: { DEFAULT: '#10b981', foreground: '#ffffff' },
            warning: { DEFAULT: '#f59e0b', foreground: '#78350f' },
            info: { DEFAULT: '#0284c7', foreground: '#ffffff' },
            destructive: { DEFAULT: '#ef4444', foreground: '#ffffff' },
            muted: { DEFAULT: '#f8fafc', foreground: '#64748b' },
            card: { DEFAULT: '#ffffff', foreground: '#0f172a' },
            border: '#e2e8f0',
            // พาเลตต์ของ care (schooldark) ใช้กับแท็บที่ย้ายมา: school / homeroom / attendance
            sd: {
              primary: 'hsl(250 75% 55%)', 'primary-hover': 'hsl(250 85% 48%)', 'primary-glow': 'hsla(250,75%,55%,0.1)',
              success: 'hsl(142 76% 36%)', 'success-bg': 'rgba(16,185,129,0.1)',
              warning: 'hsl(38 92% 40%)', 'warning-bg': 'rgba(245,158,11,0.08)',
              danger: 'hsl(350 74% 48%)', 'danger-bg': 'rgba(239,68,68,0.08)',
              info: 'hsl(199 89% 40%)', 'info-bg': 'rgba(14,165,233,0.08)',
              text: 'hsl(222 47% 12%)', 'text-2': 'hsl(215 25% 35%)', muted: 'hsl(215 15% 55%)', border: 'rgba(0,0,0,0.12)'
            }
          },
          fontFamily: { sans: ['Sarabun', 'sans-serif'], heading: ['Outfit', 'Sarabun', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background-color: #f8fafc; }
    .custom-card { background-color: #ffffff; border-color: #e2e8f0; color: #0f172a; }
    .custom-input { background-color: #ffffff; border-color: #cbd5e1; color: #0f172a; }
    .custom-input:focus { border-color: #3e63dd; outline: none; }
  </style>
  <link rel="stylesheet" href="../shared/cross-nav.css">
</head>
<body class="font-sans antialiased text-card-foreground">
<script src="../shared/cross-nav.js"></script>

  <!-- Header เรียบ ๆ ของศูนย์ตั้งค่า (ไม่มีแท็บระบบเดิมเหมือน admission) -->
  <header class="border-b border-slate-200 bg-card sticky top-0 z-30 shadow-sm">
    <div class="mx-auto flex max-w-[1400px] items-center gap-3 px-6 py-4">
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary text-primary-foreground shadow-sm">
        <i data-lucide="settings" class="h-5 w-5"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold leading-tight text-slate-900">ศูนย์รวมการตั้งค่า</h1>
        <p class="text-xs text-slate-500">School Settings Center</p>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[1400px] px-6 py-6 pb-24">
    <!-- Breadcrumb -->
    <div class="flex items-center gap-2 text-xs text-slate-500 mb-4 mt-2">
      <a href="index.html" class="hover:underline">ศูนย์รวมการตั้งค่า</a>
      <i data-lucide="chevron-right" class="h-3.5 w-3.5 text-slate-400"></i>
      <span class="text-slate-700 font-medium">ตั้งค่าโรงเรียน</span>
    </div>

    <!-- Title Area -->
    <div class="flex items-center justify-between mb-8 flex-wrap gap-4">
      <div class="flex items-center gap-3">
        <div id="tab-icon-tile" class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-600 text-white shadow-md">
          <i data-lucide="door-open" class="h-6 w-6"></i>
        </div>
        <div>
          <h2 id="tab-title" class="text-2xl font-bold tracking-tight text-slate-900">ข้อมูลห้องเรียน</h2>
          <p id="tab-desc" class="text-xs text-slate-500"></p>
        </div>
      </div>

      <button id="btn-add-row" onclick="SchoolSettings.openModal()" class="inline-flex items-center gap-2 rounded-xl bg-primary hover:bg-primary-hover text-white px-4.5 py-2.5 text-sm font-semibold transition-all shadow-md cursor-pointer active:scale-95">
        <i data-lucide="plus-circle" class="h-4.5 w-4.5"></i> เพิ่มรายการ
      </button>
    </div>

    <!-- Tabs -->
    <div class="flex items-center gap-1 bg-white border border-slate-200 p-1 rounded-xl max-w-6xl mb-6 flex-wrap">
      <a href="#tab=school" data-tab-link="school" class="tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs font-semibold transition-colors">ข้อมูลโรงเรียน</a>
      <a href="#tab=classrooms" data-tab-link="classrooms" class="tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs font-semibold transition-colors">ข้อมูลห้องเรียน</a>
      <a href="#tab=calendar" data-tab-link="calendar" class="tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs font-semibold transition-colors">ปฏิทินโรงเรียน</a>
      <a href="#tab=years" data-tab-link="years" class="tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs font-semibold transition-colors">ปีการศึกษา</a>
      <a href="#tab=levels" data-tab-link="levels" class="tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs font-semibold transition-colors">ระดับการศึกษา</a>
      <a href="#tab=majors" data-tab-link="majors" class="tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs font-semibold transition-colors">สาขางาน-สาขาวิชา</a>
      <a href="#tab=homeroom" data-tab-link="homeroom" class="tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs font-semibold transition-colors">ครูประจำชั้น</a>
      <a href="#tab=attendance" data-tab-link="attendance" class="tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs font-semibold transition-colors">เวลาเข้า-เลิกเรียน</a>
    </div>

    <!-- Classroom level filter (เฉพาะแท็บ classrooms) -->
    <div id="classrooms-filter" class="mb-4 hidden">
      <select id="classroom-level-filter" class="custom-input rounded-lg border p-2 text-xs">
        <option value="">ทุกระดับชั้น</option>
      </select>
    </div>

    <!-- Table Card -->
    <div id="table-card" class="custom-card border border-slate-200 rounded-2xl shadow-xl overflow-hidden max-w-6xl">
      <div class="p-5 border-b border-slate-200 bg-slate-50 flex justify-between items-center flex-wrap gap-2">
        <h3 class="text-sm font-bold text-slate-700 flex items-center gap-2">
          <i data-lucide="list" class="h-4 w-4 text-primary"></i> <span id="table-title">รายการทั้งหมด</span>
        </h3>
        <div class="flex items-center gap-2">
          <span id="row-count-badge" class="px-2.5 py-0.5 rounded-full text-xs bg-slate-50 border border-slate-200 text-slate-500 font-mono"></span>
          <button onclick="SchoolSettings.resetTab()" class="px-2.5 py-1 rounded-full text-xs border border-slate-200 text-slate-500 hover:bg-slate-100 flex items-center gap-1">
            <i data-lucide="rotate-ccw" class="h-3 w-3"></i> คืนค่าเริ่มต้น
          </button>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr id="table-head-row" class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs font-bold uppercase"></tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-200"></tbody>
        </table>
      </div>
    </div>

    <!-- Panel ของแท็บที่ย้ายมาจาก care (school / homeroom / attendance) — เรนเดอร์ด้วย JS -->
    <div id="custom-panel" class="hidden max-w-6xl font-sans text-sd-text"></div>
  </main>

  <!-- Add/Edit Modal -->
  <div id="modal-form" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 hidden animate-in fade-in duration-200 p-4">
    <div class="custom-card border rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto flex flex-col">
      <div class="p-5 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 id="modal-form-title" class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="plus-circle" class="h-5 w-5 text-primary"></i> เพิ่มรายการ
        </h3>
        <button type="button" onclick="SchoolSettings.closeModal()" class="p-1 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-900 transition-colors cursor-pointer">
          <i data-lucide="x" class="h-5 w-5"></i>
        </button>
      </div>

      <form id="form-el" onsubmit="SchoolSettings.saveForm(event)" class="p-6 space-y-4">
        <input type="hidden" id="form-edit-id">
        <div id="form-fields" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

        <div class="border-t border-slate-200 pt-6 flex items-center justify-end gap-3">
          <button type="button" onclick="SchoolSettings.closeModal()" class="px-5 py-2.5 rounded-xl border border-slate-200 bg-transparent text-slate-700 hover:bg-slate-100 transition-colors text-xs font-bold cursor-pointer">
            ยกเลิก
          </button>
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-primary hover:bg-primary-hover text-white transition-colors text-xs font-bold cursor-pointer">
            บันทึก
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal ครูประจำชั้น (ย้ายมาจาก care: #modal-homeroom) -->
  <div id="modal-homeroom" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">
    <div class="w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-[20px] border border-sd-border bg-white p-6 shadow-2xl text-sd-text">
      <div class="mb-1 flex items-center justify-between">
        <h3 id="modal-homeroom-title" class="font-heading text-lg font-semibold">ครูประจำชั้น</h3>
        <button type="button" data-hr-close class="rounded-lg p-1 text-sd-muted hover:bg-black/5 hover:text-sd-text cursor-pointer" aria-label="ปิด">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
        </button>
      </div>
      <p id="modal-homeroom-subtitle" class="mb-4 text-[12.5px] text-sd-muted"></p>
      <div class="mb-4 flex flex-col gap-1.5">
        <label class="text-[12.5px] font-medium text-sd-text-2">ครูที่มอบหมายแล้ว</label>
        <div id="homeroom-assigned-list" class="flex max-h-[280px] flex-col gap-2 overflow-y-auto pr-1"></div>
      </div>
      <div class="mb-4 flex flex-col gap-1.5">
        <label for="homeroom-add-teacher" class="text-[12.5px] font-medium text-sd-text-2">เพิ่มครูเข้าห้องนี้</label>
        <div class="flex gap-2">
          <select id="homeroom-add-teacher" class="min-w-0 flex-1 rounded-[14px] border border-sd-border bg-white/60 px-3.5 py-2.5 text-sm outline-none focus:border-sd-primary focus:ring-[3px] focus:ring-sd-primary/20"></select>
          <button type="button" id="btn-homeroom-add" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-[14px] border border-sd-border bg-white px-3 py-2 text-[13px] font-semibold hover:bg-black/5 cursor-pointer">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>เพิ่ม
          </button>
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button type="button" data-hr-close class="rounded-[14px] border border-sd-border bg-white px-5 py-2.5 text-sm font-semibold hover:bg-black/5 cursor-pointer">ปิด</button>
        <button type="button" id="btn-homeroom-done" class="rounded-[14px] bg-sd-primary px-5 py-2.5 text-sm font-semibold text-white hover:bg-sd-primary-hover cursor-pointer">เสร็จสิ้น</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 flex items-center gap-3 bg-white border border-slate-200 px-5 py-4 rounded-xl shadow-2xl transition-all duration-300 translate-y-10 opacity-0 pointer-events-none z-50">
    <div id="toast-icon"></div>
    <p id="toast-message" class="text-sm font-semibold text-slate-700"></p>
  </div>

  <script src="js/school-store.js"></script>
  <script src="js/sd-settings-store.js"></script>
  <script>
    (function () {
      'use strict';

      var CAL_TYPE_LABELS = { term: 'เปิด/ปิดภาคเรียน', exam: 'สอบ', event: 'กิจกรรม', holiday: 'วันหยุด' };
      var CAL_TYPE_COLOR = {
        term: 'bg-sky-50 text-sky-600 border-sky-200',
        exam: 'bg-amber-50 text-amber-600 border-amber-200',
        event: 'bg-emerald-50 text-emerald-600 border-emerald-200',
        holiday: 'bg-rose-50 text-rose-600 border-rose-200'
      };
      var STAGE_OPTIONS = ['อนุบาล', 'ประถมศึกษา', 'มัธยมศึกษาตอนต้น', 'มัธยมศึกษาตอนปลาย', 'ปวช.', 'ปวส.'];
      var MAJOR_TYPE_OPTIONS = ['แผนการเรียน', 'สาขาวิชา', 'สาขางาน'];

      function levelShorts() {
        return SchoolStore.get('school_levels').slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); }).map(function (l) { return l.short; });
      }
      function levelOrderOf(short) {
        var lv = SchoolStore.get('school_levels').filter(function (l) { return l.short === short; })[0];
        return lv ? lv.order : 999;
      }
      function majorNames() {
        return SchoolStore.get('school_majors').map(function (m) { return m.name; });
      }
      function thDate(iso) {
        if (!iso) return '';
        try { return new Date(iso + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }); }
        catch (e) { return iso; }
      }
      function escapeHtml(t) {
        return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
      }

      var TABS = {
        classrooms: {
          key: 'school_classrooms', title: 'ข้อมูลห้องเรียน', icon: 'door-open',
          desc: 'รายชื่อห้องเรียน อาคาร ความจุ และสาขา/แผนการเรียนประจำห้อง',
          fields: [
            { name: 'level', label: 'ระดับชั้น', type: 'select', options: levelShorts, required: true },
            { name: 'room', label: 'ห้องที่', type: 'number', required: true },
            { name: 'major', label: 'สาขา/แผนการเรียน', type: 'select', options: function () { return [''].concat(majorNames()); } },
            { name: 'building', label: 'อาคาร', type: 'text' },
            { name: 'capacity', label: 'ความจุ (คน)', type: 'number' },
            { name: 'homeroom', label: 'ครูประจำชั้น', type: 'text' }
          ],
          columns: [
            { label: 'ห้อง', render: function (r) { return escapeHtml(r.level + '/' + r.room); } },
            { label: 'สาขา/แผนการเรียน', render: function (r) { return escapeHtml(r.major || '-'); } },
            { label: 'อาคาร', render: function (r) { return escapeHtml(r.building || '-'); } },
            { label: 'ความจุ', render: function (r) { return escapeHtml(r.capacity || '-'); } },
            { label: 'ครูประจำชั้น', render: function (r) { return escapeHtml(r.homeroom || '-'); } }
          ],
          sort: function (a, b) { return levelOrderOf(a.level) - levelOrderOf(b.level) || (Number(a.room) - Number(b.room)); }
        },
        calendar: {
          key: 'school_calendar', title: 'ปฏิทินโรงเรียน', icon: 'calendar-days',
          desc: 'วันเปิด/ปิดภาคเรียน วันสอบ กิจกรรม และวันหยุดของโรงเรียน',
          fields: [
            { name: 'date', label: 'วันที่', type: 'date', required: true },
            { name: 'endDate', label: 'ถึงวันที่ (ถ้ามีหลายวัน)', type: 'date' },
            { name: 'title', label: 'ชื่อกิจกรรม/วันสำคัญ', type: 'text', required: true },
            { name: 'type', label: 'ประเภท', type: 'select', options: function () { return Object.keys(CAL_TYPE_LABELS); }, optionLabels: CAL_TYPE_LABELS, required: true }
          ],
          columns: [
            { label: 'วันที่', render: function (r) { return escapeHtml(thDate(r.date) + (r.endDate ? ' – ' + thDate(r.endDate) : '')); } },
            { label: 'ชื่อกิจกรรม', render: function (r) { return escapeHtml(r.title); } },
            { label: 'ประเภท', render: function (r) { return '<span class="inline-flex px-2 py-0.5 rounded-full text-[11px] font-semibold border ' + (CAL_TYPE_COLOR[r.type] || '') + '">' + escapeHtml(CAL_TYPE_LABELS[r.type] || r.type) + '</span>'; } }
          ],
          sort: function (a, b) { return (a.date || '').localeCompare(b.date || ''); }
        },
        years: {
          key: 'school_academic_years', title: 'ข้อมูลปีการศึกษา', icon: 'calendar-range',
          desc: 'ปีการศึกษาและช่วงวันที่ของแต่ละภาคเรียน',
          fields: [
            { name: 'year', label: 'ปีการศึกษา (พ.ศ.)', type: 'text', required: true },
            { name: 'term1Start', label: 'ภาคเรียนที่ 1 เริ่ม', type: 'date', required: true },
            { name: 'term1End', label: 'ภาคเรียนที่ 1 สิ้นสุด', type: 'date', required: true },
            { name: 'term2Start', label: 'ภาคเรียนที่ 2 เริ่ม', type: 'date', required: true },
            { name: 'term2End', label: 'ภาคเรียนที่ 2 สิ้นสุด', type: 'date', required: true },
            { name: 'isCurrent', label: 'ตั้งเป็นปีการศึกษาปัจจุบัน', type: 'checkbox' }
          ],
          columns: [
            { label: 'ปีการศึกษา', render: function (r) { return escapeHtml(r.year); } },
            { label: 'ภาคเรียนที่ 1', render: function (r) { return escapeHtml(thDate(r.term1Start) + ' – ' + thDate(r.term1End)); } },
            { label: 'ภาคเรียนที่ 2', render: function (r) { return escapeHtml(thDate(r.term2Start) + ' – ' + thDate(r.term2End)); } },
            { label: 'สถานะ', render: function (r) { return r.isCurrent ? '<span class="inline-flex px-2 py-0.5 rounded-full text-[11px] font-semibold border bg-emerald-50 text-emerald-600 border-emerald-200">ปีปัจจุบัน</span>' : ''; } }
          ],
          sort: function (a, b) { return (a.year || '').localeCompare(b.year || ''); },
          beforeSave: function (row, list) {
            if (row.isCurrent) list.forEach(function (r) { if (r.id !== row.id) r.isCurrent = false; });
          }
        },
        levels: {
          key: 'school_levels', title: 'ข้อมูลระดับการศึกษา', icon: 'layers',
          desc: 'ระดับชั้นเรียนและช่วงชั้นของโรงเรียน',
          fields: [
            { name: 'short', label: 'รหัสระดับชั้น (เช่น ม.1)', type: 'text', required: true },
            { name: 'name', label: 'ชื่อเต็ม', type: 'text', required: true },
            { name: 'stage', label: 'ช่วงชั้น', type: 'select', options: function () { return STAGE_OPTIONS; } },
            { name: 'order', label: 'ลำดับการแสดงผล', type: 'number' }
          ],
          columns: [
            { label: 'รหัส', render: function (r) { return escapeHtml(r.short); } },
            { label: 'ชื่อเต็ม', render: function (r) { return escapeHtml(r.name); } },
            { label: 'ช่วงชั้น', render: function (r) { return escapeHtml(r.stage || '-'); } },
            { label: 'ลำดับ', render: function (r) { return escapeHtml(r.order != null && r.order !== '' ? r.order : '-'); } }
          ],
          sort: function (a, b) { return (a.order || 0) - (b.order || 0); }
        },
        majors: {
          key: 'school_majors', title: 'ข้อมูลสาขางาน-สาขาวิชา', icon: 'briefcase',
          desc: 'แผนการเรียน สาขาวิชา และสาขางานที่โรงเรียนเปิดสอน',
          fields: [
            { name: 'code', label: 'รหัส', type: 'text' },

      // ---------------- homeroom (ครูประจำชั้น) ----------------
      var HOMEROOM_LEVELS = ['ม.1', 'ม.2', 'ม.3', 'ม.4', 'ม.5', 'ม.6'];
      var HOMEROOM_ROOMS_PER_LEVEL = 5;
      var homeroomDraft = null;          // สำเนาของ sd_homeroom_v2 ที่แก้ค้างไว้ จนกดบันทึก (เหมือน settingsStateDraft ของ care)
      var homeroomYear = '';
      var homeroomAutoFillNote = null;
      var homeroomEditingClass = null;

      function homeroomClassList() {
        var list = [];
        HOMEROOM_LEVELS.forEach(function (lv) { for (var r = 1; r <= HOMEROOM_ROOMS_PER_LEVEL; r++) list.push(lv + '/' + r); });
        return list;
      }
      function homeroomPool() {
        return SdSettings.teachers().map(function (t) {
          return { id: t.id, name: ((t.prefix || '') + (t.firstname || '') + ' ' + (t.lastname || '')).trim(), position: t.position || '', department: t.department || '' };
        });
      }
      function homeroomTeacherName(id) {
        var f = homeroomPool().filter(function (t) { return t.id === id; })[0];
        return f ? f.name : '(ไม่พบบุคลากร ' + id + ')';
      }
      function homeroomDraftInit() {
        if (!homeroomDraft) homeroomDraft = JSON.parse(JSON.stringify(SdSettings.get('sd_homeroom_v2') || {}));
        if (!homeroomYear) homeroomYear = String(SdSettings.get('sd_acad_year'));
      }
      function homeroomYearMap(year) {
        if (!homeroomDraft[year]) homeroomDraft[year] = {};
        return homeroomDraft[year];
      }
      function ensureHomeroomYearSeeded(year) {
        if (year in homeroomDraft) return;
        var prev = String(parseInt(year, 10) - 1);
        var src = homeroomDraft[prev];
        if (src && Object.keys(src).length > 0) {
          homeroomDraft[year] = JSON.parse(JSON.stringify(src));
          homeroomAutoFillNote = { year: year, fromYear: prev, rooms: Object.keys(src).length };
        } else {
          homeroomDraft[year] = {};
        }
      }

      function renderHomeroomPanel(panel) {
        homeroomDraftInit();
        var current = parseInt(SdSettings.get('sd_acad_year'), 10) || 2568;
        var yearOpts = '';
        for (var y = current - 2; y <= current + 1; y++) {
          yearOpts += '<option value="' + y + '">ปีการศึกษา ' + y + '</option>';
        }
        if (yearOpts.indexOf('value="' + homeroomYear + '"') < 0) homeroomYear = String(current);
        yearOpts = yearOpts.replace('value="' + homeroomYear + '"', 'value="' + homeroomYear + '" selected');
        ensureHomeroomYearSeeded(homeroomYear);
        var yearMap = homeroomYearMap(homeroomYear);
        var classes = homeroomClassList();

        var filled = classes.filter(function (c) { return (yearMap[c] || []).length > 0; }).length;
        var uniq = {};
        classes.forEach(function (c) { (yearMap[c] || []).forEach(function (a) { uniq[a.teacherId] = 1; }); });

        var noteHtml = '';
        if (homeroomAutoFillNote && homeroomAutoFillNote.year === homeroomYear) {
          noteHtml = '<div class="mt-3 flex items-center gap-2 rounded-lg bg-sd-warning-bg px-3.5 py-2.5 text-[12.5px] font-semibold text-sd-warning">' +
            '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0">' + P_REFRESH + '</svg>' +
            '<span>ดึงรายชื่อครูจากปีการศึกษา ' + escapeHtml(homeroomAutoFillNote.fromYear) + ' มาให้อัตโนมัติ ' + homeroomAutoFillNote.rooms + ' ห้อง — ตรวจสอบ แก้ไขห้องที่เปลี่ยน แล้วกด "บันทึก" เพื่อยืนยันเป็นข้อมูลของปี ' + escapeHtml(homeroomYear) + '</span></div>';
        }

        var rows = '';
        HOMEROOM_LEVELS.forEach(function (lv) {
          rows += '<tr><td colspan="4" class="bg-black/[0.02] px-3.5 py-2 text-xs font-bold tracking-wide text-sd-muted">🏫 ระดับชั้น ' + lv + '</td></tr>';
          classes.filter(function (c) { return c.indexOf(lv + '/') === 0; }).forEach(function (cls) {
            var assigned = yearMap[cls] || [];
            var chips = function (role) {
              var list = assigned.filter(function (a) { return a.role === role; });
              if (!list.length) return '<span class="text-xs text-sd-muted">— ยังไม่กำหนด —</span>';
              return list.map(function (a) { return '<span class="my-0.5 mr-1 inline-block rounded-full bg-sd-primary-glow px-2.5 py-[3px] text-xs font-semibold text-sd-primary">' + escapeHtml(homeroomTeacherName(a.teacherId)) + '</span>'; }).join('');
            };
            rows += '<tr class="border-b border-sd-border">' +
              '<td class="px-3.5 py-2.5 font-semibold">' + escapeHtml(cls) + '</td>' +
              '<td class="px-3.5 py-2.5">' + chips('homeroom') + '</td>' +
              '<td class="px-3.5 py-2.5">' + chips('advisor') + '</td>' +
              '<td class="px-3.5 py-2.5 text-center"><button type="button" data-hr-edit="' + escapeHtml(cls) + '" title="แก้ไขครูของห้อง ' + escapeHtml(cls) + '" class="mx-auto flex items-center justify-center rounded-lg p-1.5 text-sd-muted hover:bg-black/5 hover:text-sd-text cursor-pointer">' +
              '<svg viewBox="0 0 24 24" class="h-[15px] w-[15px] fill-none stroke-current stroke-2">' + P_EDIT + '</svg></button></td></tr>';
          });
        });

        panel.innerHTML =
          '<div class="' + C.card + '">' +
            '<div class="mb-3 flex flex-wrap items-center justify-between gap-3"><h3 class="' + C.h3 + '">' + svgH3(P_GRAD) + 'ครูประจำชั้นตามปีการศึกษา</h3>' +
              '<div class="flex flex-wrap items-center gap-2.5"><label for="homeroom-year" class="text-[13px] text-sd-muted">ปีการศึกษา</label>' +
              '<select id="homeroom-year" class="' + C.input + ' !w-[150px]">' + yearOpts + '</select>' +
              '<button type="button" id="btn-save-homeroom" class="' + C.btn + '">' + SAVE_ICON + 'บันทึก</button></div></div>' +
            '<p class="text-[12.5px] text-sd-muted">กำหนดครูประจำชั้นและครูที่ปรึกษาของแต่ละห้อง แยกตามปีการศึกษา</p>' + noteHtml +
          '</div>' +
          '<div class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">' +
            statCard(P_CHECK, 'bg-sd-success-bg text-sd-success', 'ห้องที่กำหนดครูแล้ว', filled) +
            statCard(P_ALERT, 'bg-sd-warning-bg text-sd-warning', 'ห้องที่ยังว่าง', classes.length - filled) +
            statCard(P_USER, 'bg-sd-primary-glow text-sd-primary', 'ครูที่ถูกมอบหมาย', Object.keys(uniq).length) +
          '</div>' +
          '<div class="' + C.card + '">' +
            '<div class="' + C.head + '"><h3 class="' + C.h3 + '">' + svgH3(P_TABLE) + 'ตารางครูประจำชั้น (ม.1 – ม.6)</h3></div>' +
            '<div class="overflow-x-auto"><table class="w-full border-collapse text-[13px]">' +
              '<thead><tr class="bg-black/[0.03] text-left text-[11px] font-semibold uppercase tracking-[0.8px] text-sd-muted">' +
                '<th class="w-[110px] border-b border-sd-border px-3.5 py-2.5">ห้อง</th><th class="border-b border-sd-border px-3.5 py-2.5">ครูประจำชั้น</th>' +
                '<th class="border-b border-sd-border px-3.5 py-2.5">ครูที่ปรึกษา / ร่วมประจำชั้น</th><th class="w-[90px] border-b border-sd-border px-3.5 py-2.5 text-center">จัดการ</th></tr></thead>' +
              '<tbody>' + rows + '</tbody></table></div>' +
          '</div>';

        panel.querySelector('#homeroom-year').addEventListener('change', function (e) {
          homeroomYear = e.target.value;
          renderHomeroomPanel(panel);
        });
        panel.querySelector('#btn-save-homeroom').addEventListener('click', function () {
          SdSettings.set('sd_homeroom_v2', homeroomDraft);
          homeroomAutoFillNote = null;
          renderHomeroomPanel(panel);
          showToast('บันทึกครูประจำชั้นปีการศึกษา ' + homeroomYear + ' แล้ว (' + Object.keys(homeroomYearMap(homeroomYear)).length + ' ห้อง)');
        });
        panel.querySelectorAll('[data-hr-edit]').forEach(function (b) {
          b.addEventListener('click', function () { openHomeroomModal(b.getAttribute('data-hr-edit')); });
        });
      }

      function reRenderHomeroomPanel() { renderHomeroomPanel(document.getElementById('custom-panel')); }

      function openHomeroomModal(cls) {
        homeroomEditingClass = cls;
        document.getElementById('modal-homeroom-title').textContent = 'ครูประจำชั้น ' + cls;
        document.getElementById('modal-homeroom-subtitle').textContent = 'ปีการศึกษา ' + homeroomYear + ' — เพิ่มครูได้ไม่จำกัดจำนวน และกำหนดบทบาทของแต่ละคนได้';
        renderHomeroomModal();
        var m = document.getElementById('modal-homeroom');
        m.classList.remove('hidden'); m.classList.add('flex');

      function closeHomeroomModal() {

          sel.innerHTML = '<option value="" disabled selected>ยังไม่มีข้อมูลบุคลากร — เปิดหน้ารายชื่อบุคลากรก่อน</option>';

      function addHomeroomTeacher() {
        var cls = homeroomEditingClass, id = document.getElementById('homeroom-add-teacher').value;
        if (!cls || !id) { showToast('ไม่มีบุคลากรให้เพิ่มแล้ว', 'warning'); return; }
        var ym = homeroomYearMap(homeroomYear);
        if (!ym[cls]) ym[cls] = [];

        ym[cls].push({ teacherId: id, role: role });
        renderHomeroomModal(); reRenderHomeroomPanel();
      }
      function changeHomeroomRole(idx, role) {
        var ym = homeroomYearMap(homeroomYear), cls = homeroomEditingClass;
        if (!cls || !ym[cls] || !ym[cls][idx]) return;
        ym[cls][idx].role = role;
        renderHomeroomModal(); reRenderHomeroomPanel();
      }
      function removeHomeroomTeacher(idx) {
        var ym = homeroomYearMap(homeroomYear), cls = homeroomEditingClass;
        if (!cls || !ym[cls]) return;

      function bindHomeroomModal() {
        var m = document.getElementById('modal-homeroom');
        m.addEventListener('click', function (e) {
          if (e.target === m || e.target.closest('[data-hr-close]')) { closeHomeroomModal(); return; }

          if (rm) removeHomeroomTeacher(Number(rm.getAttribute('data-hr-remove')));

          if (s) changeHomeroomRole(Number(s.getAttribute('data-hr-role')), s.value);

      }

      // ---------------- attendance (เวลาเข้า-เลิกเรียนของนักเรียน) ----------------
      var ATT_DAY_LABELS = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
      function attMin(t) { if (!t || t === '-') return null; var p = t.split(':').map(Number); return p[0] * 60 + p[1]; }
      function attHHMM(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
      function attDaysLabel(days) {
        var sorted = days.slice().sort(function (a, b) { return a - b; });
        if (sorted.join(',') === '1,2,3,4,5') return 'จ–ศ';
        if (sorted.join(',') === '1,2,3,4,5,6') return 'จ–ส';
        return sorted.map(function (d) { return ATT_DAY_LABELS[d]; }).join(', ') || '-';
      }
      function renderAttendancePanel(panel) {
        var s = SdSettings.attendance();
        var dayBtns = ATT_DAY_LABELS.map(function (lbl, i) {
          return '<label class="relative"><input type="checkbox" value="' + i + '" class="peer absolute h-0 w-0 opacity-0"' + (s.days.indexOf(i) >= 0 ? ' checked' : '') + '>' +
            '<span class="flex h-[46px] w-[46px] cursor-pointer items-center justify-center rounded-xl border-[1.5px] border-sd-border bg-black/[0.02] text-sm font-semibold text-sd-text-2 transition-colors hover:bg-black/5 hover:text-sd-text peer-checked:border-sd-primary peer-checked:bg-sd-primary peer-checked:text-white peer-checked:shadow-[0_0_12px_hsla(250,75%,55%,0.1)] peer-checked:hover:bg-sd-primary-hover">' + lbl + '</span></label>';
        }).join('');
        var unit = function (id, val) {
          return '<div class="flex items-center gap-2"><input type="number" id="' + id + '" class="' + C.input + '" min="0" max="120" value="' + escapeHtml(val) + '"><span class="whitespace-nowrap text-[13px] text-sd-muted">นาที</span></div>';
        };
        var time = function (id, val) { return '<input type="time" id="' + id + '" class="' + C.input + '" value="' + escapeHtml(val) + '">'; };
        var req = ' <span class="ml-0.5 text-sd-danger">*</span>';
        panel.innerHTML =
          '<div class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">' +
            statCard(P_CLOCK, 'bg-sd-primary-glow text-sd-primary', 'เวลาเข้าเรียน', escapeHtml(s.start) + ' น.') +
            statCard(P_CLOCK, 'bg-sd-success-bg text-sd-success', 'เวลาเลิกเรียน', escapeHtml(s.end) + ' น.') +
            statCard(P_HISTORY, 'bg-sd-warning-bg text-sd-warning', 'ขีดจำกัดสาย', escapeHtml(s.lateMin) + ' นาที') +
            statCard(P_CAL2, 'bg-sd-info-bg text-sd-info', 'วันเรียน', escapeHtml(attDaysLabel(s.days))) +
          '</div>' +
          '<div class="' + C.card + '">' +
            '<div class="' + C.head + '"><h3 class="' + C.h3 + '">' + svgH3(P_CLOCK) + ' เวลาเรียนหลัก</h3><button type="button" id="btn-save-att" class="' + C.btn + '">บันทึก</button></div>' +
            '<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">' +
              field('att-set-start', 'เวลาเข้าเรียน' + req, time('att-set-start', s.start)) +
              field('att-set-end', 'เวลาเลิกเรียน' + req, time('att-set-end', s.end)) +
              field('att-set-absent', 'เวลาที่ถือว่า "ขาดเรียน"', time('att-set-absent', s.absentAfter)) +
              field('att-set-gate-open', 'เวลาเปิดประตู (เริ่มบันทึกเวลาเข้า)', time('att-set-gate-open', s.gateOpen)) +
            '</div><div class="' + C.divider + '"></div>' +
            '<div class="grid grid-cols-1 gap-4 md:grid-cols-3">' +
              field('att-set-late', 'นาทีที่ถือว่า "มาสาย" (หลังเวลาเข้าเรียน)', unit('att-set-late', s.lateMin)) +
              field('att-set-early', 'นาทีที่ถือว่า "ออกก่อนเวลา" (ก่อนเวลาเลิกเรียน)', unit('att-set-early', s.earlyMin)) +
            '</div>' +
            '<p class="mt-3 text-[13px] leading-relaxed text-sd-text-2">ตัวอย่าง: เข้าเรียน 08:00 และขีดจำกัดสาย 0 นาที → มาถึง 08:01 ขึ้นไปถือว่า "สาย" ถ้ามาถึงหลังเวลาที่ถือว่าขาดเรียน (หรือไม่มาเลย) → "ขาด"</p>' +
          '</div>' +
          '<div class="' + C.card + '">' +
            '<div class="' + C.head + '"><h3 class="' + C.h3 + '">' + svgH3(P_CAL2) + ' กำหนดวันเรียนประจำสัปดาห์</h3></div>' +
            '<p class="' + C.cardDesc + '">เลือกวันที่มีการเรียนการสอน (วันที่ไม่ได้เลือกจะไม่แสดงในการเช็คชื่อและรายงาน)</p>' +
            '<div id="att-set-days" class="flex flex-wrap gap-2.5">' + dayBtns + '</div>' +
          '</div>';
        panel.querySelector('#btn-save-att').addEventListener('click', function () { saveAttendanceSettings(panel); });
      }
      function saveAttendanceSettings(panel) {
        var q = function (id) { return panel.querySelector('#' + id).value; };
        var next = {
          start: q('att-set-start'), end: q('att-set-end'), absentAfter: q('att-set-absent'), gateOpen: q('att-set-gate-open'),
          lateMin: Math.max(0, parseInt(q('att-set-late'), 10) || 0),
          earlyMin: Math.max(0, parseInt(q('att-set-early'), 10) || 0),
          days: Array.prototype.map.call(panel.querySelectorAll('#att-set-days input:checked'), function (cb) { return Number(cb.value); })
        };
        var problems = [];
        if (!next.start || !next.end) problems.push('กรุณากรอกเวลาเข้าเรียนและเวลาเลิกเรียน');
        else if (attMin(next.end) <= attMin(next.start)) problems.push('เวลาเลิกเรียนต้องหลังเวลาเข้าเรียน');
        if (next.absentAfter && next.start && attMin(next.absentAfter) <= attMin(next.start) + next.lateMin) problems.push('เวลาที่ถือว่าขาดเรียนต้องหลังเวลาที่เริ่มนับว่าสาย');
        if (next.gateOpen && next.start && attMin(next.gateOpen) > attMin(next.start)) problems.push('เวลาเปิดประตูต้องไม่หลังเวลาเข้าเรียน');
        if (!next.days.length) problems.push('เลือกวันเรียนอย่างน้อย 1 วัน');
        if (problems.length) { alert(problems.join('\n')); return; }
        if (!next.absentAfter) next.absentAfter = attHHMM(attMin(next.start) + 120);
        SdSettings.saveAttendance(next);
        renderAttendancePanel(panel);
        showToast('บันทึกเวลาเข้า-เลิกเรียนของนักเรียนแล้ว');
      }

      var CUSTOM_TABS = {
        school: { title: 'ข้อมูลโรงเรียน', desc: 'ชื่อ รหัส ที่อยู่ของโรงเรียน ปีการศึกษาปัจจุบัน และการแจ้งเตือนระบบ', iconSvg: svgTile(P_HOUSE), render: renderSchoolPanel },
        homeroom: { title: 'ข้อมูลครูประจำชั้น', desc: 'กำหนดครูประจำชั้นและครูที่ปรึกษาของแต่ละห้อง แยกตามปีการศึกษา', iconSvg: svgTile(P_GRAD), render: renderHomeroomPanel },
        attendance: { title: 'เวลาเข้า-เลิกเรียนของนักเรียน', desc: 'กำหนดเวลาเข้า-เลิกเรียน ขีดจำกัดสาย และวันเรียนประจำสัปดาห์', iconSvg: svgTile(P_CLOCK), render: renderAttendancePanel }
      };

      var currentTab = 'school';
      var currentRows = [];
      var classroomLevelFilter = '';

      function getTabFromHash() {
        var h = location.hash.replace('#', '');
        var m = /tab=([a-z-]+)/.exec(h);
        return (m && (TABS[m[1]] || CUSTOM_TABS[m[1]])) ? m[1] : 'school';
      }

      function switchTab(tab) {
        currentTab = (TABS[tab] || CUSTOM_TABS[tab]) ? tab : 'school';
        if (location.hash !== '#tab=' + currentTab) location.hash = 'tab=' + currentTab;
        render();
      }

      function render() {
        var custom = CUSTOM_TABS[currentTab];
        var panel = document.getElementById('custom-panel');
        var tile = document.getElementById('tab-icon-tile');
        if (currentTab !== 'homeroom') { homeroomDraft = null; homeroomAutoFillNote = null; closeHomeroomModal(); }
        document.getElementById('table-card').classList.toggle('hidden', !!custom);
        document.getElementById('btn-add-row').classList.toggle('hidden', !!custom);
        panel.classList.toggle('hidden', !custom);
        document.querySelectorAll('.tab-pill').forEach(function (a) {
          var active = a.getAttribute('data-tab-link') === currentTab;
          a.className = 'tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs transition-colors ' +
            (active ? 'font-bold bg-[#3e63dd] text-white shadow-sm' : 'font-semibold text-slate-500 hover:text-slate-700');
        });
        if (custom) {
          document.getElementById('tab-title').textContent = custom.title;
          document.getElementById('tab-desc').textContent = custom.desc;
          tile.className = TILE_CLASS_CUSTOM;
          tile.innerHTML = custom.iconSvg;
          document.getElementById('classrooms-filter').classList.add('hidden');
          custom.render(panel);
          return;
        }
        tile.className = TILE_CLASS_TABLE;
        var def = TABS[currentTab];
        document.getElementById('tab-title').textContent = def.title;
        document.getElementById('tab-desc').textContent = def.desc;
        document.getElementById('tab-icon-tile').innerHTML = '<i data-lucide="' + def.icon + '" class="h-6 w-6"></i>';
        document.getElementById('table-title').textContent = def.title + 'ทั้งหมด';

        document.querySelectorAll('.tab-pill').forEach(function (a) {
          var active = a.getAttribute('data-tab-link') === currentTab;
          a.className = 'tab-pill flex-1 text-center py-2 px-3 rounded-lg text-xs transition-colors ' +
            (active ? 'font-bold bg-[#3e63dd] text-white shadow-sm' : 'font-semibold text-slate-500 hover:text-slate-700');
        });

        var filterWrap = document.getElementById('classrooms-filter');
        filterWrap.classList.toggle('hidden', currentTab !== 'classrooms');
        if (currentTab === 'classrooms') {
          var sel = document.getElementById('classroom-level-filter');
          var opts = ['<option value="">ทุกระดับชั้น</option>'].concat(levelShorts().map(function (s) {
            return '<option value="' + escapeHtml(s) + '"' + (s === classroomLevelFilter ? ' selected' : '') + '>' + escapeHtml(s) + '</option>';
          }));
          sel.innerHTML = opts.join('');
        }

        currentRows = SchoolStore.get(def.key).slice().sort(def.sort || function () { return 0; });
        if (currentTab === 'classrooms' && classroomLevelFilter) {

          '<th class="p-4 w-28 text-center">การจัดการ</th>';

        var body = document.getElementById('table-body');

          body.innerHTML = '<tr><td colspan="' + (def.columns.length + 1) + '" class="p-8 text-center text-xs text-slate-400">ยังไม่มีข้อมูล</td></tr>';
        } else {
          body.innerHTML = currentRows.map(function (r) {
            return '<tr class="hover:bg-slate-50">' +
              def.columns.map(function (c) { return '<td class="p-4">' + c.render(r) + '</td>'; }).join('') +
              '<td class="p-4 text-center"><div class="flex items-center justify-center gap-1">' +
              '<button onclick="SchoolSettings.openModal(\'' + r.id + '\')" class="p-2 rounded-lg bg-slate-50 border border-slate-200 text-sky-600 hover:bg-sky-50" title="แก้ไข"><i data-lucide="edit-3" class="h-3.5 w-3.5"></i></button>' +
              '<button onclick="SchoolSettings.removeRow(\'' + r.id + '\')" class="p-2 rounded-lg bg-slate-50 border border-slate-200 text-rose-600 hover:bg-rose-50" title="ลบ"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>' +
              '</div></td></tr>';
          }).join('');

      function fieldInputHtml(f, value) {
        var id = 'field-' + f.name;
        if (f.type === 'select') {
          var opts = typeof f.options === 'function' ? f.options() : (f.options || []);
          return '<select id="' + id + '" class="w-full rounded-xl custom-input p-3 text-sm border focus:ring-1 focus:ring-primary">' +
            opts.map(function (o) {
              var label = (f.optionLabels && f.optionLabels[o]) || o || '(ไม่ระบุ)';
              return '<option value="' + escapeHtml(o) + '"' + (o === value ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
            }).join('') + '</select>';
        }
        if (f.type === 'checkbox') {
          return '<label class="flex items-center gap-2 text-sm text-slate-600"><input type="checkbox" id="' + id + '"' + (value ? ' checked' : '') + ' class="rounded border-slate-300"> ' + escapeHtml(f.label) + '</label>';
        }
        return '<input type="' + f.type + '" id="' + id + '"' + (f.required ? ' required' : '') + ' value="' + escapeHtml(value == null ? '' : value) + '" class="w-full rounded-xl custom-input p-3 text-sm border focus:ring-1 focus:ring-primary">';
      }

      function openModal(id) {
        var def = TABS[currentTab];
        var row = id ? currentRows.filter(function (r) { return r.id === id; })[0] : null;
        document.getElementById('form-edit-id').value = id || '';
        document.getElementById('modal-form-title').innerHTML =
          '<i data-lucide="' + (id ? 'edit-3' : 'plus-circle') + '" class="h-5 w-5 text-primary"></i> ' + (id ? 'แก้ไข' : 'เพิ่ม') + def.title;
        var wrap = document.getElementById('form-fields');
        wrap.innerHTML = def.fields.map(function (f) {
          if (f.type === 'checkbox') {
            return '<div class="md:col-span-2 pt-1">' + fieldInputHtml(f, row ? row[f.name] : false) + '</div>';
          }
          return '<div><label class="block text-xs font-bold text-slate-500 mb-1.5">' + escapeHtml(f.label) + (f.required ? ' *' : '') + '</label>' + fieldInputHtml(f, row ? row[f.name] : '') + '</div>';
        }).join('');
        document.getElementById('modal-form').classList.remove('hidden');
        if (window.lucide) lucide.createIcons();
      }

      function closeModal() {
        document.getElementById('modal-form').classList.add('hidden');
      }

      function saveForm(e) {
        e.preventDefault();
        var def = TABS[currentTab];
        var id = document.getElementById('form-edit-id').value;
        var list = SchoolStore.get(def.key);
        var row = id ? list.filter(function (r) { return r.id === id; })[0] : null;
        var isNew = !row;
        if (isNew) { row = { id: SchoolStore.uid(currentTab + '-') }; list.push(row); }
        def.fields.forEach(function (f) {
          var el = document.getElementById('field-' + f.name);
          if (!el) return;
          if (f.type === 'checkbox') row[f.name] = el.checked;
          else if (f.type === 'number') row[f.name] = el.value === '' ? '' : Number(el.value);
          else row[f.name] = el.value;
        });
        if (def.beforeSave) def.beforeSave(row, list);
        SchoolStore.save(def.key, list);
        closeModal();
        render();
        showToast(isNew ? 'เพิ่มรายการเรียบร้อย' : 'บันทึกการแก้ไขเรียบร้อย');
      }

      function removeRow(id) {
        if (!confirm('ยืนยันการลบรายการนี้? ข้อมูลนี้ไม่สามารถกู้คืนได้')) return;
        var def = TABS[currentTab];
        var list = SchoolStore.get(def.key).filter(function (r) { return r.id !== id; });
        SchoolStore.save(def.key, list);
        render();
        showToast('ลบรายการเรียบร้อย');
      }

      function resetTab() {
        if (!confirm('คืนค่าข้อมูลเริ่มต้นของแท็บนี้? การแก้ไขที่ทำไว้ทั้งหมดจะหายไป')) return;
        SchoolStore.reset(TABS[currentTab].key);
        render();
        showToast('คืนค่าเริ่มต้นเรียบร้อย');
      }

      var toastTimer = null;
      function showToast(msg, type) {
        var el = document.getElementById('toast');
        document.getElementById('toast-message').textContent = msg;
        document.getElementById('toast-icon').innerHTML = type === 'warning'
          ? '<i data-lucide="alert-triangle" class="h-5 w-5 text-amber-500"></i>'
          : '<i data-lucide="check-circle" class="h-5 w-5 text-emerald-500"></i>';
        if (window.lucide) lucide.createIcons();
        el.classList.remove('translate-y-10', 'opacity-0', 'pointer-events-none');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.add('translate-y-10', 'opacity-0', 'pointer-events-none'); }, 2200);
      }

      window.SchoolSettings = {
        openModal: openModal, closeModal: closeModal, saveForm: saveForm,
        removeRow: removeRow, resetTab: resetTab, switchTab: switchTab
      };

      document.addEventListener('DOMContentLoaded', function () {
        bindHomeroomModal();
        document.querySelectorAll('.tab-pill').forEach(function (a) {
          a.addEventListener('click', function (e) {
            e.preventDefault();
            switchTab(a.getAttribute('data-tab-link'));
          });
        });
        document.getElementById('classroom-level-filter').addEventListener('change', function (e) {
          classroomLevelFilter = e.target.value;
          render();
        });
        window.addEventListener('hashchange', function () {
          var t = getTabFromHash();
          if (t !== currentTab) { currentTab = t; render(); }
        });
        currentTab = getTabFromHash();
        render();
      });
    })();
  </script>
</body>
</html>
