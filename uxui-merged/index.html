<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolDark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Sarabun', sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }
    header { text-align: center; margin-bottom: 40px; max-width: 640px; }
    .logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 56px; height: 56px; border-radius: 14px;
      background: linear-gradient(135deg, #3e63dd, #0284c7);
      color: #fff; margin-bottom: 16px;
    }
    h1 { font-size: 24px; margin: 0 0 6px; font-weight: 700; }
    header p { margin: 0; color: #64748b; font-size: 14px; line-height: 1.6; }
    #cross-nav-hub {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 880px;
    }
    .hub-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .06);
    }
    .hub-card h2 { margin: 0 0 2px; font-size: 17px; font-weight: 700; }
    .hub-note {
      margin: 0 0 16px; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em; color: #94a3b8;
    }
    .hub-card ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .hub-card a {
      display: block; padding: 9px 12px; border-radius: 8px;
      color: #334155; text-decoration: none; font-size: 14px;
      transition: background .15s, color .15s;
    }
    .hub-card a:hover { background: #eff4ff; color: #3e63dd; }
    footer { margin-top: 40px; font-size: 12px; color: #94a3b8; text-align: center; max-width: 640px; line-height: 1.7; }
    @media (max-width: 600px) { body { padding: 32px 16px; } }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 3 1 9l11 6 9-4.91V17h2V9L12 3z"/><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
      </svg>
    </div>
    <h1>SchoolDark</h1>
  </header>

  <div id="cross-nav-hub"></div>

  <script src="shared/cross-nav.js"></script>
</body>
</html>
