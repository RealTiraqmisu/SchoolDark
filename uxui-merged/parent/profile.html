<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โปรไฟล์ | พอร์ทัลผู้ปกครอง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-sans antialiased bg-muted text-card-foreground min-h-screen">
  <div id="parent-nav"></div>
  <main class="max-w-6xl mx-auto px-4 py-6">
    <div class="space-y-6">
      <div class="bg-card rounded-xl border border-border shadow-sm p-5">
        <h2 class="font-bold text-card-foreground mb-4">ข้อมูลผู้ปกครอง</h2>
        <form id="parent-form">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-card-foreground mb-1">คำนำหน้า</label>
              <select id="pf-prefix" class="w-full rounded-lg border border-border px-3 py-2 text-sm">
                <option value="นาย">นาย</option>
                <option value="นาง">นาง</option>
                <option value="นางสาว">นางสาว</option>
              </select>
            </div>
            <div></div>
            <div>
              <label class="block text-sm font-medium text-card-foreground mb-1">ชื่อ</label>
              <input type="text" id="pf-firstName" class="w-full rounded-lg border border-border px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-sm font-medium text-card-foreground mb-1">นามสกุล</label>
              <input type="text" id="pf-lastName" class="w-full rounded-lg border border-border px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-sm font-medium text-card-foreground mb-1">ความสัมพันธ์</label>
              <select id="pf-relation" class="w-full rounded-lg border border-border px-3 py-2 text-sm">
                <option value="บิดา">บิดา</option>
                <option value="มารดา">มารดา</option>
                <option value="ผู้ปกครอง">ผู้ปกครอง</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-card-foreground mb-1">เบอร์โทร</label>
              <input type="tel" id="pf-phone" pattern="^0[0-9]{1,2}-?[0-9]{3,4}-?[0-9]{4}$" class="w-full rounded-lg border border-border px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-sm font-medium text-card-foreground mb-1">อีเมล</label>
              <input type="email" id="pf-email" class="w-full rounded-lg border border-border px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-sm font-medium text-card-foreground mb-1">LINE ID</label>
              <input type="text" id="pf-lineId" class="w-full rounded-lg border border-border px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-sm font-medium text-card-foreground mb-1">อาชีพ</label>
              <input type="text" id="pf-occupation" class="w-full rounded-lg border border-border px-3 py-2 text-sm">
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-card-foreground mb-1">ที่อยู่</label>
              <textarea id="pf-address" rows="2" class="w-full rounded-lg border border-border px-3 py-2 text-sm"></textarea>
            </div>
          </div>
          <div id="pf-error" class="text-destructive text-sm mt-3 hidden"></div>
          <div class="mt-4 flex items-center justify-between">
            <a href="settings.html" class="text-sm text-primary hover:underline">เปลี่ยนรหัสผ่าน/การแจ้งเตือน → ตั้งค่าบัญชี</a>
            <button type="submit" class="bg-primary hover:bg-primary-hover text-white rounded-lg px-4 py-2 font-medium">บันทึกการเปลี่ยนแปลง</button>
          </div>
        </form>
      </div>

      <div class="bg-card rounded-xl border border-border shadow-sm p-5">
        <h2 class="font-bold text-card-foreground mb-4">ข้อมูลบุตร</h2>
        <div id="children-info" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        <p class="text-sm text-muted-foreground mt-4">หากข้อมูลไม่ถูกต้อง กรุณาติดต่อฝ่ายทะเบียนของโรงเรียน</p>
      </div>
    </div>
  </main>

  <script src="js/parent-store.js"></script>
  <script src="js/parent-nav.js"></script>
  <script>
    (function () {
      var esc = ParentUI.escapeHtml;

      /* ---------------- การ์ด 1: ข้อมูลผู้ปกครอง ---------------- */
      function fillParentForm() {
        var p = ParentStore.getParent();
        document.getElementById('pf-prefix').value = p.prefix || 'นาย';
        document.getElementById('pf-firstName').value = p.firstName || '';
        document.getElementById('pf-lastName').value = p.lastName || '';
        document.getElementById('pf-relation').value = p.relation || 'ผู้ปกครอง';
        document.getElementById('pf-phone').value = p.phone || '';
        document.getElementById('pf-email').value = p.email || '';
        document.getElementById('pf-lineId').value = p.lineId || '';
        document.getElementById('pf-occupation').value = p.occupation || '';
        document.getElementById('pf-address').value = p.address || '';
      }
      fillParentForm();

      document.getElementById('parent-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var firstName = document.getElementById('pf-firstName').value.trim();
        var lastName = document.getElementById('pf-lastName').value.trim();
        var errBox = document.getElementById('pf-error');

        if (!firstName || !lastName) {
          errBox.textContent = 'กรุณากรอกชื่อและนามสกุล';
          errBox.classList.remove('hidden');
          return;
        }
        errBox.classList.add('hidden');

        ParentStore.saveParent({
          prefix: document.getElementById('pf-prefix').value,
          firstName: firstName,
          lastName: lastName,
          relation: document.getElementById('pf-relation').value,
          phone: document.getElementById('pf-phone').value.trim(),
          email: document.getElementById('pf-email').value.trim(),
          lineId: document.getElementById('pf-lineId').value.trim(),
          occupation: document.getElementById('pf-occupation').value.trim(),
          address: document.getElementById('pf-address').value.trim()
        });
        ParentUI.toast('บันทึกข้อมูลสำเร็จ', 'success');
      });

      /* ---------------- การ์ด 2: ข้อมูลบุตร (อ่านอย่างเดียว) ---------------- */
      (function renderChildren() {
        var children = ParentStore.getChildren();
        var html = children.map(function (c) {
          var fullName = esc(c.prefix) + esc(c.firstName) + ' ' + esc(c.lastName);
          return '<div class="border border-border rounded-lg p-4">' +
            '<div class="font-bold text-card-foreground">' + fullName + ' <span class="font-normal text-muted-foreground">(' + esc(c.nickname) + ')</span></div>' +
            '<div class="grid grid-cols-2 gap-x-3 gap-y-1 text-sm mt-2">' +
              '<div class="text-muted-foreground">รหัสนักเรียน</div><div class="text-card-foreground">' + esc(c.studentId) + '</div>' +
              '<div class="text-muted-foreground">ห้อง/เลขที่</div><div class="text-card-foreground">' + esc(c.classroom) + ' / ' + esc(c.no) + '</div>' +
              '<div class="text-muted-foreground">แผนการเรียน</div><div class="text-card-foreground">' + esc(c.studyPlan) + '</div>' +
              '<div class="text-muted-foreground">วันเกิด</div><div class="text-card-foreground">' + esc(ParentUI.fmtDate(c.dob)) + '</div>' +
              '<div class="text-muted-foreground">กรุ๊ปเลือด</div><div class="text-card-foreground">' + esc(c.bloodType) + '</div>' +
              '<div class="text-muted-foreground">ครูประจำชั้น</div><div class="text-card-foreground">' + esc(c.homeroomTeacher) + '</div>' +
            '</div>' +
            '<a href="student.html?id=' + esc(c.id) + '" class="inline-block mt-3 text-sm text-primary hover:underline">ดูประวัติเต็ม →</a>' +
          '</div>';
        }).join('');

        document.getElementById('children-info').innerHTML = html;
      })();

      if (window.lucide) lucide.createIcons();
    })();
  </script>
</body>
</html>
