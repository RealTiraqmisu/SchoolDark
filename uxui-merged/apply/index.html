<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครเรียนออนไลน์ - SchoolDark</title>

  <!-- Google Fonts Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../admission/js/tailwind-config.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background-color: #f8fafc; }
  </style>
</head>
<body class="font-sans antialiased text-card-foreground min-h-screen">
  <!-- พอร์ทัลสาธารณะสำหรับผู้สมัคร/ผู้ปกครอง (ไม่ใช่หน้าแอดมิน) — ไม่โหลด shared/cross-nav.js/.css
       เจตนา แยกออกจาก admission/ ที่เป็นฝั่งเจ้าหน้าที่ เพื่อไม่ให้ผู้สมัครจริงเห็นเมนู/ปุ่มของ
       ฝ่ายทะเบียนปนกัน (ดู CLAUDE.md หัวข้อ "จุดเชื่อมของเมนูรวมในแต่ละหน้า") -->
  <header class="border-b bg-card shadow-sm">
    <div class="mx-auto flex max-w-[900px] items-center justify-between px-6 py-4">
      <div class="flex items-center gap-3">
        <div>
          <h1 class="text-lg font-bold leading-tight">พอร์ทัลสมัครเรียนออนไลน์</h1>
          <p class="text-xs text-muted-foreground">SchoolDark Student Admission Portal</p>
        </div>
      </div>
      <a href="../index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-primary transition-colors">
        <i data-lucide="arrow-left" class="h-4 w-4"></i> กลับหน้ารวมระบบ (สำหรับการสาธิต)
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-[900px] px-6 py-12">
    <div class="text-center mb-10 space-y-2">
      <h2 class="text-2xl font-bold text-slate-800">ยินดีต้อนรับสู่ระบบรับสมัครนักเรียน</h2>
      <p class="text-sm text-slate-500">เลือกรายการที่ต้องการด้านล่าง</p>
    </div>

    <div class="grid gap-6 sm:grid-cols-2 max-w-2xl mx-auto">
      <a href="register.html" class="group bg-card border border-border rounded-2xl shadow-sm p-6 text-center space-y-3 hover:border-primary hover:shadow-md transition-all">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-xl bg-primary/10 text-primary group-hover:bg-primary group-hover:text-white transition-colors">
          <i data-lucide="file-edit" class="h-7 w-7"></i>
        </div>
        <h3 class="font-bold text-slate-800">สมัครเรียน</h3>
        <p class="text-xs text-slate-500 leading-relaxed">กรอกใบสมัครออนไลน์สำหรับนักเรียนใหม่ระดับชั้น ม.1 และ ม.4</p>
      </a>

      <a href="status.html" class="group bg-card border border-border rounded-2xl shadow-sm p-6 text-center space-y-3 hover:border-primary hover:shadow-md transition-all">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-xl bg-primary/10 text-primary group-hover:bg-primary group-hover:text-white transition-colors">
          <i data-lucide="search" class="h-7 w-7"></i>
        </div>
        <h3 class="font-bold text-slate-800">ตรวจสอบสถานะ</h3>
        <p class="text-xs text-slate-500 leading-relaxed">ตรวจสอบผลการคัดเลือก ชำระเงิน และมอบตัวออนไลน์</p>
      </a>
    </div>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
